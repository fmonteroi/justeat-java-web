<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/index.js" defer></script>
  </head>

  <body class="page-login">
    <header class="top">
      <a class="back" href="busqueda.html" aria-label="Volver">&lt;</a>

      <a class="brand" href="index.html" aria-label="Inicio">
        <img src="images/logo_justeat.svg" alt="Logo Just Eat" width="30" height="30" />
        <strong>JUST EAT</strong>
      </a>
    </header>

    <main class="wrap">
      <section class="card auth-card" aria-label="Iniciar sesión">
        <h1>Iniciar sesión</h1>

        <!-- Contenedor de mensajes del formulario (los nodos se crean desde JS) -->
        <div id="formMessages" class="messages" aria-live="polite"></div>

        <form id="loginForm" action="#" method="post" novalidate>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              placeholder="nombre@dominio.com"
              required
              maxlength="120" />
          </div>

          <div class="field">
            <label for="pass">Contraseña</label>
            <div class="pw">
              <input
                id="pass"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Mínimo 8 caracteres"
                required
                minlength="8"
                maxlength="64" />

              <button id="togglePassword" type="button" class="eye" aria-label="Mostrar u ocultar contraseña">
                👁
              </button>
            </div>

            <p class="hint" id="passHint">Usa al menos 8 caracteres. Evita espacios.</p>
          </div>

          <button class="boton" type="submit">Iniciar sesión</button>

          <p class="center"><a href="#">¿Olvidaste tu contraseña?</a></p>
          <hr />
          <p class="center muted">¿No tienes cuenta? <a class="accent" href="registro.html">Regístrate</a></p>
        </form>
      </section>
    </main>
  </body>
</html>
